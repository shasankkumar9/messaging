spring.application.name=messaging

server.port=8092

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/messaging_db
spring.datasource.username=postgres
spring.datasource.password=4142
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=message
spring.jpa.properties.hibernate.format_sql=true
# create tables from schema.sql (ddl-auto=validate only checks them)
spring.sql.init.mode=always
