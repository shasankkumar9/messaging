services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: messaging_db
      POSTGRES_PASSWORD: "4142"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d messaging_db"]
      interval: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8092:8092"
    environment:
      # overrides spring.datasource.url from application.properties
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/messaging_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
